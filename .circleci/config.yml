version: 2.1

orbs:
  coveralls: coveralls/coveralls@2.2.5

workflows:
  igvf-catalog-tests:
    jobs:
      - lint
      - data:
          requires:
            - lint
      - build:
          requires:
            - lint
      - trpc:
          requires:
            - lint
      - trpc-integration:
          requires:
            - trpc

jobs:
  lint:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/igvf-catalog
    steps:
      - checkout
      - run: pip install pre-commit==3.2.1
      - run: pre-commit run --all-files
  trpc:
    docker:
      - image: cimg/node:20.20.2
    working_directory: ~/igvf-catalog
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Run Jest tests
          command: npm test
      - coveralls/upload:
          token: COVERALLS_REPO_TOKEN
          coverage_file: coverage/lcov.info
          fail_on_error: false
  trpc-integration:
    docker:
      - image: cimg/node:20.20.2
    working_directory: ~/igvf-catalog
    # ENV=production only selects src/env.ts's env-var-override code path here - it has
    # nothing to do with a real prod deploy. The actual db-dev connection details come from
    # CircleCI project Environment Variables (Project Settings > Environment Variables), never
    # committed to config/development.json: IGVF_CATALOG_ARANGODB_URI, _DBNAME, _USERNAME,
    # _PASSWORD.
    environment:
      ENV: production
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          # Hits the real shared dev ArangoDB (db-dev.catalog.igvf.org).
          name: Run integration tests against db-dev
          command: npm run test:integration
  data:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/igvf-catalog/data
    steps:
      - checkout:
          path: ~/igvf-catalog
      - run:
          name: Install dependencies
          command: |
            pip3 install -r requirements.txt
            pip install coverage-lcov
      - run:
          name: Run tests with coverage
          environment:
            PYTHONPATH: /home/circleci/igvf-catalog/data
          command: pytest --cov=adapters --cov=db --cov-report=term-missing --cov-report=html --cov-report=xml
      - coveralls/upload:
          token: COVERALLS_REPO_TOKEN
          fail_on_error: false
  build:
    docker:
      - image: cimg/node:20.20.2
    resource_class: medium
    working_directory: ~/igvf-catalog
    steps:
      - checkout
      - run: npm install
      - run: npm run build
