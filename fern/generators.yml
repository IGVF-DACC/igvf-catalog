# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
# openapi.json is generated by `npm run openapi:generate` and is not committed.
api:
  default-environment: Production
  environments:
    Production: https://api.catalogkg.igvf.org/api
    Development: https://api-dev.catalogkg.igvf.org/api
  specs:
    - openapi: openapi.json
